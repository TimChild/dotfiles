# NOTE: [general] level needs to be a top (and not actually in [general] table)
general.import = [
	"~/.config/alacritty/catppuccin-mocha.toml",
]

[font.normal]
family = "JetBrainsMono Nerd Font"

[font.bold]
family = "JetBrainsMono Nerd Font"

[font.italic]
family = "JetBrainsMono Nerd Font"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"

[terminal.shell]
program = "zsh"
# -l -- login shell
# -c -- command (execute the following command)
# NOTE: Opening alacritty will jump straight into tmux
# - detaching tmux will close the terminal
# - use <prefix>:new to create a new session
# - `new-session -A -s 0` is idempotent: the first window creates session "0"
#   (a pristine 1-pane server, so tmux-resurrect auto-restore sees a clean
#   from-scratch state and restores every pane's working dir); any concurrent
#   windows just attach to it. The old `tmux attach || tmux` raced on multi-
#   window login — the fallback `tmux` spawned extra panes, so the background
#   restore adopted them at ~ instead of cd-ing them to their saved dirs.
args = ["-l", "-c", "tmux new-session -A -s 0"]

[window]
option_as_alt = "Both"

[hints]
alphabet = "jfkdls;ahgurieowpq"

[[hints.enabled]]
command = "open"
hyperlinks = true
post_processing = true
persist = false
regex = '''(https?://|ftp://|mailto:|magnet:|git://|ssh://|file://|news:|ipfs:|ipns:|gemini://|gopher://)[^\s"'<>`\\|{}\[\]]+'''
mouse = { enabled = true, mods = "Command" }
binding = { key = "U", mods = "Command|Shift" }
