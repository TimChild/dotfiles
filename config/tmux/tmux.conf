# Set leader to ctrl+space instead of default ctrl+b
unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

# Bind shortcuts
bind-key N new-session  # Create new session with <prefix> N
# Use <prefix>+r to rename window (and disable future automatic renaming)
bind-key r command-prompt -i -p "Rename window:" "rename-window '%%'; setw automatic-rename off"
# Note: 'setw automatic-rename on' will re-enable automatic renaming

# Set default shell to match terminal
set-option -g default-shell $SHELL

# Enable mouse (scroll and window drag)
set -g mouse on

setw -g mode-keys vi
setw -g xterm-keys on

# Start window numbering from 1
set -g base-index 1
setw -g pane-base-index 1
# Renumber when a windows is closed
setw -g renumber-windows on
# Rename window based on current program
setw -g automatic-rename on
# setw -g automatic-rename off

# Set the terminal title
set -g set-titles on

# # Set zsh as default
# set-option -g default-shell /bin/zsh
# set-option -g default-command "/bin/zsh -l"

# Set vim mode
set-window-option -g mode-keys vi

# Set things that neovim wants
set-option -g -sg escape-time 10
set-option -g focus-events on

# Set colors to work properly (particularly for nvim)
# tmux-256color (not the legacy screen-256color) is the correct inner terminfo
# for tmux 3.x — it accurately describes scroll regions / redraw, which fixes
# the copy-mode scrollback "tearing" (mis-aligned lines on scroll up/down).
set -g default-terminal "tmux-256color"
# Truecolor: target the TERM the OUTER terminal actually reports. Alacritty
# reports xterm-256color (not "alacritty"), so the old alacritty:Tc override
# never matched and was a no-op. RGB advertises full 24-bit color.
set -ga terminal-overrides ",xterm-256color:RGB"

# Setup catpuccin theme (Note: Status bar ONLY! (backround is set by terminal))
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Use window names instead of pane names (#T) for window tabs.
# Append a Claude-state indicator (filled dot = streaming, empty dot =
# waiting). @claude-state is set per-window by the streamdeck tmux plugin's
# Tracker once per ~1.5s; absent => no glyph shown.
set -g @catppuccin_window_text " #W#{?#{==:#{@claude-state},streaming}, ● ,#{?#{==:#{@claude-state},waiting}, ○ ,}}"
set -g @catppuccin_window_current_text " #W#{?#{==:#{@claude-state},streaming}, ● ,#{?#{==:#{@claude-state},waiting}, ○ ,}}"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"

set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Setup plugin manager
set -g @plugin 'tmux-plugins/tpm'
# Setup some more reasonable default options for tmux
set -g @plugin 'tmux-plugins/tmux-sensible'
# Setup vim keybindings for pane navigation
set -g @plugin 'christoomey/vim-tmux-navigator'
# Setup theme
set -g @plugin 'catppuccin/tmux#v2.1.2' # See https://github.com/catppuccin/tmux/tags for additional tags
# Setup better copying
set -g @plugin 'tmux-plugins/tmux-yank'
# Setup better pane navigation shortcuts (e.g. ctrl+|)
set -g @plugin 'tmux-plugins/tmux-pain-control'
# Show cpu usage in status bar
set -g @plugin 'tmux-plugins/tmux-cpu'
# Setup better neovim opening shortcuts
# set -g @plugin 'trevarj/tmux-open-nvim'
# Setup easier copying actions (automatic selections of likely copy targets)
# set -g @plugin 'Morantron/tmux-fingers'

# Save / restore sessions across restarts.
# tmux-resurrect: manual save (prefix + Ctrl-s) / restore (prefix + Ctrl-r) of
#   sessions, windows, pane layouts, working directories and window names.
set -g @plugin 'tmux-plugins/tmux-resurrect'
# tmux-continuum: auto-save every N minutes and auto-restore on tmux server start.
# NOTE: keep continuum the LAST plugin — it appends to status-right to drive its
#   periodic save timer, so it must load after status-right is set above.
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- resurrect options ---
# Also save & restore visible pane contents (scrollback shown at restore time).
set -g @resurrect-capture-pane-contents 'on'

# --- continuum options ---
set -g @continuum-restore 'on'        # auto-restore last save when the tmux server starts
set -g @continuum-save-interval '15'  # minutes between automatic saves (default 15)

run "~/.config/tmux/plugins/tpm/tpm"

