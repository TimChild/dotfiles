---
- name: Install Alacritty
  package:
    name: alacritty
    state: present

- name: Ensure alacritty config directory exists
  file:
    path: "{{ ansible_env.HOME }}/.config/alacritty"
    state: directory

- name: Link alacritty.toml
  file:
    src: "{{ playbook_dir }}/../config/alacritty/alacritty.toml"
    dest: "{{ ansible_env.HOME }}/.config/alacritty/alacritty.toml"
    state: link
    force: true

- name: Link alacritty catppuccin-mocha.toml
  file:
    src: "{{ playbook_dir }}/../config/alacritty/catppuccin-mocha.toml"
    dest: "{{ ansible_env.HOME }}/.config/alacritty/catppuccin-mocha.toml"
    state: link
    force: true

# tmux.conf is symlinked per-file (not the whole dir) so that the machine-local
# plugins/ directory (cloned by TPM) can live alongside it under ~/.config/tmux.
- name: Ensure tmux config directory exists
  file:
    path: "{{ ansible_env.HOME }}/.config/tmux"
    state: directory

- name: Link tmux.conf
  file:
    src: "{{ playbook_dir }}/../config/tmux/tmux.conf"
    dest: "{{ ansible_env.HOME }}/.config/tmux/tmux.conf"
    state: link
    force: true

# nvim config is a whole-directory symlink (tracked as a git submodule under
# config/nvim — ensure it's checked out: git submodule update --init).
- name: Link nvim config
  file:
    src: "{{ playbook_dir }}/../config/nvim"
    dest: "{{ ansible_env.HOME }}/.config/nvim"
    state: link
    force: true

- name: Install ZSH and plugins
  package:
    name:
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting
    state: present

- name: Configure Oh My Zsh using gantsign.oh-my-zsh
  include_role:
    name: gantsign.oh-my-zsh
  vars:
    users:
      - username: "{{ ansible_env.USER | default(ansible_user_id) }}"
        oh_my_zsh:
          theme: robbyrussell
          plugins:
            - aws
            - docker
            - docker-compose
            - doctl
            - dotenv
            - fzf
            - gh
            - git
            - golang
            - npm
            - nvm
            - vi-mode
            - zsh-syntax-highlighting
            - zsh-autosuggestions
            - zsh-history-substring-search
            - zsh-you-should-use
          update_mode: reminder
          update_frequency: 14
          write_zshrc: true

- name: Link plugins.zsh file
  file:
    src: "{{ playbook_dir }}/../config/oh-my-zsh-custom/plugins.zsh"
    dest: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/plugins.zsh"
    state: link

- name: Link extra.zsh file
  file:
    src: "{{ playbook_dir }}/../config/oh-my-zsh-custom/extra.zsh"
    dest: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/extra.zsh"
    state: link

- name: Set ZSH as default shell
  shell: chsh -s $(which zsh)
  args:
    executable: /bin/bash 